name: Race calendar

# Keeps docs/data/f1.json current, so a theme can point race_calendar_url at the raw file and every TV
# picks up moved sessions, new races and next year's calendar without rebuilding the launcher.

on:
  schedule:
    # Once a day, after the FIA usually posts changes.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: race-calendar
  cancel-in-progress: true

jobs:
  update:
    name: Fetch the F1 calendar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Current season and next year
        run: |
          python3 tools/race_calendar_feed.py \
            --out docs/data/f1.json \
            --season current \
            --season next
      - name: Commit only when the calendar changed
        run: |
          if git diff --quiet -- docs/data/f1.json; then
            echo "calendar unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/f1.json
          git commit -m "Update F1 race calendar"
          git push
